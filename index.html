<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>볼 배틀</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#16181d;--ink:#f2f3f5;--mut:#9aa1ad;--line:#2d323c;--arena:#000;--acc:#7b90ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#16181d;--ink:#f2f3f5;--mut:#9aa1ad;--line:#2d323c;--arena:#000;--acc:#7b90ff}}
:root[data-theme="dark"]{--bg:#000;--card:#16181d;--ink:#f2f3f5;--mut:#9aa1ad;--line:#2d323c;--arena:#000;--acc:#7b90ff}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:14px}
h1{text-align:center;font-size:30px;margin:18px 0 4px}
.sub{text-align:center;color:var(--mut);font-size:14px;line-height:1.6;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:8px 0 14px}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:17px;font-weight:700}
.btn:active{transform:scale(.98)}
.hide{display:none!important}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.opt:hover{border-color:var(--acc)}
.orb{flex:none;width:52px;height:52px;border-radius:50%;box-shadow:inset -6px -8px 12px rgba(0,0,0,.25),inset 5px 5px 10px rgba(255,255,255,.35)}
.opt b{font-size:17px}
.st{font-size:12.5px;color:var(--mut);margin:2px 0}
.sk{font-size:13.5px}
.arena{position:relative;margin-top:6px}
canvas{display:block;width:100%;aspect-ratio:1/1;background:var(--arena);border:3px solid #fff;border-radius:4px}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;text-align:center}
.ov .big{font-size:clamp(34px,10vw,56px);font-weight:800;line-height:1.2;padding:0 10px;word-break:keep-all}
.ov .btn{width:auto;padding:13px 30px}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.who{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:14px;min-width:0}
.who b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:12px;height:12px;border-radius:50%}
.bn{color:var(--mut);font-size:12px;white-space:nowrap}
.lb{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:6px 0 3px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:6px}
.hp{background:#22c55e}
.cdb{background:var(--acc)}
.tip{text-align:center;color:var(--mut);font-size:13px;margin-top:12px}
.ov{overflow:hidden}
.ov .big{position:relative;z-index:1}
.drop{animation:drop .9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes drop{from{transform:translateY(-320px) scale(.6);opacity:0}to{transform:none;opacity:1}}
#again{position:relative;z-index:1;animation:fadein .5s .9s both}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(580px) rotate(540deg)}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="wrap">

<section id="title">
  <h1>⚔️ 볼 배틀</h1>
  <p class="sub">능력이 다른 공 3개 중 하나를 골라<br>컴퓨터 또는 친구와 겨뤄요.<br>능력은 쿨타임이 차면 자동으로 발동해요.</p>
  <div class="card">
    <label for="nm">내 이름</label>
    <input id="nm" maxlength="8" placeholder="플레이어" autocomplete="off">
    <button class="btn" id="go">게임 시작 (컴퓨터와 대결)</button>
  </div>
  <div class="card" id="onl" style="margin-top:12px">
    <b>🌐 온라인 대전 (친구와 1:1)</b>
    <p class="st" style="margin:6px 0 10px">친구가 같은 링크를 열고 있어야 해요. 한 명이 방을 만들고, 다른 한 명이 방 코드를 입력해요.</p>
    <button class="btn" id="mkroom">방 만들기</button>
    <input id="code" maxlength="4" inputmode="numeric" placeholder="방 코드 4자리" autocomplete="off">
    <button class="btn" id="joinroom" style="background:#2d323c">방 입장</button>
    <div id="nst" class="tip"></div>
  </div>
</section>

<section id="pick" class="hide">
  <h1 style="font-size:22px">공을 하나 골라요</h1>
  <p class="sub">3개 중 1개를 선택!</p>
  <div id="opts"></div>
</section>

<section id="battle" class="hide">
  <div class="arena">
    <canvas id="cv" width="500" height="500"></canvas>
    <div class="ov hide" id="ov"><div class="big" id="ovt"></div><button class="btn hide" id="again">한 판 더</button></div>
  </div>
  <div class="panels" id="panels"></div>
</section>

</div>

function show(id){['title','pick','battle'].forEach(s=>$('#'+s).classList.toggle('hide',s!==id))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function mk(d,owner,x,y,ang){return{d:{...d,r:Math.round(d.r*1.6)},flash:0,owner,x,y,vx:Math.cos(ang),vy:Math.sin(ang),hp:d.hp,max:d.hp,cd:d.cd*.6,slow:0,shield:0,boost:0,bm:1,hitCd:0,stun:0,poison:0,pt:0,rage:0,armor:0,vamp:0,ghost:0,pull:0,kx:0,ky:0,wc:0}}

}

let parts=[],beams=[],hitstop=0,flashA=0;
function streak(x,y,c,n,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.4+Math.random()*.6);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:life,m:life,c,s:2,ln:true})}}

function dmg(att,def,amt){
  if(def.ghost>0){pop(def,'회피!','#9ca3af');return}
  if(def.shield>0){att.hp-=amt;att.flash=.15;burst(def.x,def.y,'#4ade80',14,200,.4);pop(att,'-'+amt,'#ef4444');pop(def,'반사!','#22c55e');return}
  if(def.armor>0)amt=Math.round(amt/2);
  def.hp-=amt;def.flash=.15;pop(def,'-'+amt,'#ef4444');
  if(att.vamp>0)att.hp=Math.min(att.max,att.hp+amt/2);
}
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function away(from,to){const dx=to.x-from.x,dy=to.y-from.y,l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]}

function canUse(b,o){
  const k=dist(b,o);
  switch(b.d.id){
    case 'fire':return k<140;
    case 'thorn':return k<200;
    case 'volt':return k>110;
    case 'heal':return b.hp<=b.max-15;
    case 'giant':return k<150;
    case 'stun':return k<170;
    case 'sniper':return k>150;
    case 'ghost':return k<120;
    case 'magnet':return k>120;
    case 'wind':return k<150;
    case 'teleport':return k>150;
    case 'poison':return o.poison<=0;
    case 'rage':case 'armor':case 'vamp':return k<240;

    case 'slime':return k>100;

    case 'zombie':return o.poison<=0;
    case 'oneshot':return k<110;
    case 'ufo':return k<260;
    default:return true;
  }
}

function run(id,b,o){
  const c=b.d.color;
  switch(id){

const BUMPS=[{x:175,y:175,r:22,f:0},{x:325,y:325,r:22,f:0}];
function wallB(b){
  const r=b.d.r,sp=Math.hypot(b.kx,b.ky);let hit=false;
  if(b.x<r){b.x=r;b.vx=Math.abs(b.vx);b.kx=Math.abs(b.kx)*.6;hit=true}
  if(b.x>W-r){b.x=W-r;b.vx=-Math.abs(b.vx);b.kx=-Math.abs(b.kx)*.6;hit=true}
  if(b.y<r){b.y=r;b.vy=Math.abs(b.vy);b.ky=Math.abs(b.ky)*.6;hit=true}
  if(b.y>W-r){b.y=W-r;b.vy=-Math.abs(b.vy);b.ky=-Math.abs(b.ky)*.6;hit=true}
  if(hit&&sp>300&&b.wc<=0){b.wc=.4;if(b.ghost<=0){b.hp-=5;pop(b,'-5','#fca5a5')}b.flash=.15;burst(b.x,b.y,'#ffffff',16,320,.45);streak(b.x,b.y,b.d.color,12,600,.4);fx.push({x:b.x,y:b.y,r:5,max:70,c:'#fff',t:.3});shake=Math.max(shake,10)}
}
function bumpB(b){
  BUMPS.forEach(u=>{const dx=b.x-u.x,dy=b.y-u.y,d=Math.hypot(dx,dy)||1,rr=b.d.r+u.r;
    if(d<rr){const nx=dx/d,ny=dy/d;b.x=u.x+nx*rr;b.y=u.y+ny*rr;b.vx=nx;b.vy=ny;b.kx+=nx*520;b.ky+=ny*520;u.f=.2;burst(u.x+nx*u.r,u.y+ny*u.r,'#fbbf24',10,260,.4);shake=Math.max(shake,5)}});
}
function update(dt){
  gt+=dt;
  const list=[me,foe];
  list.forEach(b=>{
    const o=b===me?foe:me;
    b.cd=Math.max(0,b.cd-dt);b.slow=Math.max(0,b.slow-dt);b.shield=Math.max(0,b.shield-dt);b.hitCd=Math.max(0,b.hitCd-dt);
    ['stun','rage','armor','vamp','ghost','pull','flash','wc'].forEach(k=>b[k]=Math.max(0,b[k]-dt));
    if(b.poison>0){b.poison-=dt;b.pt+=dt;if(b.pt>=1){b.pt-=1;b.hp-=4;pop(b,'-4','#84cc16')}}
    if(b.ghost>0&&Math.random()<.5)burst(b.x,b.y,'#94a3b8',1,30,.5);
    if(b.rage>0&&Math.random()<.7)burst(b.x,b.y,'#ef4444',1,60,.5);
    if(b.poison>0&&Math.random()<.4)burst(b.x,b.y,'#84cc16',1,40,.7);
    if(b.vamp>0&&Math.random()<.4)burst(b.x,b.y,'#e11d48',1,40,.6);
    if(b.boost>0&&b.bm>3)burst(b.x,b.y,b.d.color,2,30,.4);
    if(b.cd<=0&&b.stun<=0&&canUse(b,o))use(b,o);
    let m=b.slow>0?.5:1;
    if(b.boost>0){m=b.bm;b.boost-=dt}
    const fr=Math.exp(-3.2*dt);
    if(b.stun>0){b.x+=b.kx*dt;b.y+=b.ky*dt;b.kx*=fr;b.ky*=fr;wallB(b);bumpB(b);return}
    if(b.boost<=0&&(calm<=0||b.pull>0)){const dx=o.x-b.x,dy=o.y-b.y,dd=Math.hypot(dx,dy)||1,kk=b.pull>0?6:(dd>70?2+700/dd:0);b.vx+=dx/dd*kk*dt;b.vy+=dy/dd*kk*dt}
    const l=Math.hypot(b.vx,b.vy)||1;b.vx/=l;b.vy/=l;
    b.x+=(b.vx*b.d.spd*m+b.kx)*dt;b.y+=(b.vy*b.d.spd*m+b.ky)*dt;b.kx*=fr;b.ky*=fr;if(Math.hypot(b.kx,b.ky)>260)burst(b.x,b.y,b.d.color,1,20,.3);
    const r=b.d.r;
    wallB(b);bumpB(b);
  });
  const k=dist(me,foe),rr=me.d.r+foe.d.r;
  if(k<rr){
    const[nx,ny]=away(me,foe),ov=rr-k;
    me.x-=nx*ov/2;me.y-=ny*ov/2;foe.x+=nx*ov/2;foe.y+=ny*ov/2;
    if(me.vx*nx+me.vy*ny>0){const d=me.vx*nx+me.vy*ny;me.vx-=2*d*nx;me.vy-=2*d*ny}
    if(foe.vx*nx+foe.vy*ny<0){const d=foe.vx*nx+foe.vy*ny;foe.vx-=2*d*nx;foe.vy-=2*d*ny}
    if(me.hitCd<=0){
      me.hitCd=foe.hitCd=.5;
      const a=me.d.atk*(me.rage>0?2:1),b=foe.d.atk*(foe.rage>0?2:1);
      dmg(me,foe,a);dmg(foe,me,b);shake=16;calm=1.2;hitstop=.08;flashA=.5;
      const mx=(me.x+foe.x)/2,my=(me.y+foe.y)/2;burst(mx,my,'#ffffff',14,260,.4);burst(mx,my,me.d.color,8,200,.5);burst(mx,my,foe.d.color,8,200,.5);fx.push({x:mx,y:my,r:5,max:70,c:'#fff',t:.3});fx.push({x:mx,y:my,r:5,max:130,c:me.d.color,t:.45});fx.push({x:mx,y:my,r:5,max:130,c:foe.d.color,t:.45});streak(mx,my,'#fff',18,700,.35);streak(mx,my,me.d.color,10,600,.4);streak(mx,my,foe.d.color,10,600,.4);const mA=me.d.r*me.d.r,mB=foe.d.r*foe.d.r,T=mA+mB;me.kx-=nx*1120*mB/T;me.ky-=ny*1120*mB/T;foe.kx+=nx*1120*mA/T;foe.ky+=ny*1120*mA/T;
    }
  }
  fx.forEach(f=>{f.t-=dt;f.r+=(f.max-f.r)*Math.min(1,dt*10)});fx=fx.filter(f=>f.t>0);
  pops.forEach(p=>{p.t-=dt;p.y-=30*dt});pops=pops.filter(p=>p.t>0);
  delayed.forEach(e=>{e.t-=dt;if(e.t<=0)e.fn()});delayed=delayed.filter(e=>e.t>0);
  shake=Math.max(0,shake-dt*40);calm=Math.max(0,calm-dt);
  BUMPS.forEach(u=>u.f=Math.max(0,u.f-dt));
  hazT-=dt;if(hazT<=0&&!(net&&net.role==='guest')){hazT=7+Math.random()*3;hazards.push({x:90+Math.random()*320,y:90+Math.random()*320,r:75,t:1.3})}
  hazards.forEach(h=>{h.t-=dt;if(h.t<=0){fx.push({x:h.x,y:h.y,r:10,max:h.r+20,c:'#fde047',t:.4});burst(h.x,h.y,'#fde047',30,300,.6);streak(h.x,h.y,'#fff',14,600,.4);beams.push({x1:h.x,y1:0,x2:h.x,y2:h.y,c:'#fde047',j:1,t:.3});shake=Math.max(shake,8);[me,foe].forEach(b=>{if(b.ghost<=0&&Math.hypot(b.x-h.x,b.y-h.y)<h.r+b.d.r*.5){b.hp-=10;b.flash=.15;pop(b,'-10','#fde047')}})}});
  hazards=hazards.filter(h=>h.t>0);
  if(gt>30){if(!sudden){sudden=true;pop({x:250,y:250,d:{r:0}},'서든데스!','#ef4444',true);flashA=.4}[me,foe].forEach(b=>{b.hp-=dt*(2+(gt-30)*.4)})}
  parts.forEach(p=>{p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96});parts=parts.filter(p=>p.t>0);
  beams.forEach(e=>e.t-=dt);beams=beams.filter(e=>e.t>0);
  [me,foe].forEach(b=>{if(b.hp<=0&&b.d.id==='zombie'&&!b.rev){b.rev=1;b.hp=40;b.ghost=1.2;burst(b.x,b.y,'#84cc16',50,320,.9);pop(b,'부활!','#84cc16',true);flashA=.5;shake=14}});
  if((me.hp<=0||foe.hp<=0)&&!(net&&net.role==='guest'))finish();
}

function finish(){finishAs(me.hp>=foe.hp)}
function finishAs(meWin){
  state='end';shake=0;
  if(net&&net.role==='host')net.room.send('endGame',{w:meWin?'h':'g',h:[Math.round(me.hp),Math.round(foe.hp)]});
  $('#ovt').innerHTML='🏆<br>'+(meWin?me.owner:foe.owner)+' 승리!';
  $('#ovt').className='big drop';
  for(let i=0;i<36;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},85%,60%);animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*1.5}s`;$('#ov').appendChild(e)}
  $('#ov').classList.remove('hide');$('#again').classList.remove('hide');
}

function ui(){
  [me,foe].forEach((b,i)=>{
    const h=Math.max(0,Math.ceil(b.hp));
    $('#hv'+i).textContent=h+' / '+b.max;
    $('#hb'+i).style.width=(h/b.max*100)+'%';
    $('#cv'+i).textContent=b.cd<=0?'준비 완료':b.cd.toFixed(1)+'초';
    $('#cb'+i).style.width=Math.max(0,(1-b.cd/b.d.cd)*100)+'%';
  });
}

function drawBall(b){
  const{x,y}=b,r=b.d.r;
  if(b.ghost>0)ctx.globalAlpha=.45;
  [['rage','#b91c1c'],['armor','#94a3b8'],['vamp','#9f1239']].forEach(([k,cc],i)=>{if(b[k]>0){ctx.beginPath();ctx.arc(x,y,r+4+i*3,0,7);ctx.strokeStyle=cc;ctx.lineWidth=3;ctx.stroke()}});
  if(b.shield>0){ctx.beginPath();ctx.arc(x,y,r+7,0,7);ctx.strokeStyle='#22c55e';ctx.lineWidth=4;ctx.stroke();const tm=performance.now()/300;ctx.fillStyle='#16a34a';for(let i=0;i<10;i++){const a=tm+i*.628;ctx.beginPath();ctx.moveTo(x+Math.cos(a-.12)*(r+7),y+Math.sin(a-.12)*(r+7));ctx.lineTo(x+Math.cos(a)*(r+18),y+Math.sin(a)*(r+18));ctx.lineTo(x+Math.cos(a+.12)*(r+7),y+Math.sin(a+.12)*(r+7));ctx.fill()}}
  if(b.slow>0){ctx.beginPath();ctx.arc(x,y,r+5,0,7);ctx.strokeStyle='#7dd3fc';ctx.setLineDash([4,4]);ctx.lineWidth=3;ctx.stroke();ctx.setLineDash([])}
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(.35,b.d.color);g.addColorStop(1,b.d.color);
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.shadowColor=b.d.color;ctx.shadowBlur=16;ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;if(b.flash>0){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill()}
  ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();
  ctx.fillStyle='#fff';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(x+s*r*.32,y-r*.05,r*.2,0,7);ctx.fill()});
  ctx.fillStyle='#222';
  [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(x+s*r*.32+b.vx*2,y-r*.05+b.vy*2,r*.1,0,7);ctx.fill()});
  ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#8a8f98';
  ctx.globalAlpha=1;
  ctx.fillText(b.owner,x,y-r-(b.shield>0?14:7));

  if(b.poison>0)ctx.fillText('☠️',x+r+10,y-r+4);
}
function draw(){
  ctx.clearRect(0,0,W,W);if(flashA>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.5,flashA)+')';ctx.fillRect(0,0,W,W)}
  ctx.strokeStyle='rgba(128,128,128,.15)';ctx.lineWidth=1;
  
  hazards.forEach(h=>{const p=1-h.t/1.3;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fillStyle='rgba(253,224,71,'+(.08+.18*Math.abs(Math.sin(p*14)))+')';ctx.fill();ctx.strokeStyle='#fde047';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([])});

function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='count'){
    cnt-=dt;
    if(cnt<=0){state='fight';$('#ov').classList.add('hide')}
    else $('#ovt').textContent=Math.ceil(cnt);
  }else if(state==='fight'){
    if(hitstop>0)hitstop-=dt;else update(dt);
    if(net&&net.role==='host'){
      net.tS=(net.tS||0)+dt;
      if(net.tS>.1){net.tS=0; net.room.send('snap', mkSnap());}
    }
  }
  flashA=Math.max(0,flashA-dt*2.5);draw();ui();
  $('#cv').style.transform=shake>0?`translate(${(Math.random()-.5)*shake}px,${(Math.random()-.5)*shake}px) scale(${1+shake*.0015})`:'';
  if(state!=='idle')raf=requestAnimationFrame(loop);
}

const SF=['x','y','vx','vy','kx','ky','hp','cd','slow','shield','boost','bm','hitCd','stun','poison','pt','rage','armor','vamp','ghost','pull','wc','rev'];
function nst(t){$('#nst').textContent=t}
function mkSnap(){const r=n=>Math.round((+n||0)*100)/100;return{ts:Date.now(),g:r(gt),c:r(calm),b:[me,foe].map(b=>SF.map(k=>r(b[k]))),z:hazards.map(h=>[Math.round(h.x),Math.round(h.y),r(h.t)])}}
function applySnap(sn){
  [me,foe].forEach((b,j)=>SF.forEach((k,i)=>{const v=sn.b[j][i];if(i<6)b[k]+=(v-b[k])*.7;else b[k]=v}));
  gt=sn.g;calm=sn.c;hazards=sn.z.map(z=>({x:z[0],y:z[1],t:z[2],r:75}));
}

async function netStart(role,code){
  if(!/^\d{4}$/.test(code)){nst('방 코드는 숫자 4자리예요');return}
  myName=$('#nm').value.trim()||'플레이어';pName=myName;
  try{
    if(net && net.roomObj) sb.removeChannel(net.roomObj);
    const channel=sb.channel('ball-'+code, {config:{presence:{key:role}}});
    
    net={room:{
      leave:()=>sb.removeChannel(channel),
      send:(ev,d)=>channel.send({type:'broadcast',event:ev,payload:d}),
      presence:(d)=>channel.track(d),
      peers:()=>Object.values(channel.presenceState()).flat()
    },role,code,ep:0,lastEp:0,picked:null,foePicked:null,ready:false,lastTs:0,tS:0};

    channel.on('presence',{event:'sync'},()=>netPeers());
    channel.on('broadcast',{event:'pick'},({payload})=>{
      if(payload && payload.role !== role){
        net.foePicked = payload.pk;
        checkStart();
      }
    });
    channel.on('broadcast',{event:'go'},({payload})=>{
      if(payload && net.role === 'guest'){
        const go = payload;
        const hd=BALLS.find(d=>d.id===go.h), gd=BALLS.find(d=>d.id===go.g);
        if(hd && gd){
          net.lastEp=go.ep; net.picked=null; net.lastTs=0;
          startBattle(hd, gd, String(go.hn).slice(0,8), String(go.gn).slice(0,8), go.a[0], go.a[1]);
        }
      }
    });
    channel.on('broadcast',{event:'snap'},({payload})=>{
      if(payload && net.role==='guest' && state==='fight' && payload.ts>net.lastTs){
        net.lastTs=payload.ts; applySnap(payload);
      }
    });
    channel.on('broadcast',{event:'endGame'},({payload})=>{
      if(payload && net.role==='guest'){
        if(payload.h){ me.hp=payload.h[0]; foe.hp=payload.h[1]; }
        finishAs(payload.w==='h');
      }
    });

    channel.subscribe(async(status)=>{
      if(status==='SUBSCRIBED'){
        await channel.track({n:myName,r:role==='host'?'h':'g'});
        nst(role==='host'?'방 코드 '+code+' - 친구 대기 중...':'방 '+code+' 입장 완료!');
      }
    });
    net.roomObj=channel;
  }catch(e){net=null;nst('연결 실패')}
}

function netPick(d){
  net.picked=d.id;
  net.room.send('pick',{role:net.role, pk:d.id});
  $('#opts').innerHTML='<p class="sub">상대가 고르는 중...</p>';
  checkStart();
}

function checkStart(){
  if(!net || !net.picked || !net.foePicked) return;
  if(net.role==='host'){
    const hd=BALLS.find(d=>d.id===net.picked), gd=BALLS.find(d=>d.id===net.foePicked);
    if(!hd || !gd) return;
    net.ep++; net.lastEp=net.ep;
    const a=[Math.random()-.5, Math.PI+Math.random()-.5];
    const ps=net.room.peers();
    const other=ps.find(p=>p.r==='g');
    const gn=String(other?.n||'상대').slice(0,8);
    
    net.room.send('go',{ep:net.ep, h:hd.id, g:gd.id, hn:myName, gn, a});
    startBattle(hd, gd, myName, gn, a[0], a[1]);
  }
}

function netPeers(){
  if(!net)return;
  const ps=net.room.peers(), want=net.role==='host'?'g':'h';
  const other=ps.find(p=>p.r===want);
  if(!other){if(net.ready)nst('상대가 나갔어요');return}
  if(!net.ready){net.ready=true;nst('');openPick();return}
}

$('#mkroom').onclick=()=>netStart('host',String(1000+(Math.random()*9000|0)));
$('#joinroom').onclick=()=>netStart('guest',$('#code').value.trim());

$('#go').onclick=()=>{pName=$('#nm').value.trim()||'플레이어';net=null;openPick()};
$('#again').onclick=openPick;
</script>
</body>
</html>
